<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario Síncrono</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="form-container">
        <form>
            <div class="form-group">
                <label for="username">Nombre de usuario (5 a 15 caracteres):</label>
                <input type="text" id="username" name="username" placeholder="Escribe tu usuario" required>
            </div>

            <div class="form-group">
                <label for="age">Edad (Rango permitido de 18 a 99 años):</label>
                <input type="number" id="age" name="age" placeholder="Tu edad" required>
            </div>

            <div class="form-group">
                <label for="country">País de residencia:</label>
                <select id="country" name="country" required>
                    <option value="" disabled selected>Selecciona un país...</option>
                    <option value="MX">México</option>
                    <option value="CO">Colombia</option>
                    <option value="AR">Argentina</option>
                    <option value="ES">España</option>
                </select>
            </div>

            <div class="form-group">
                <label>Tipo de cuenta:</label>
                <div class="radio-group">
                    <label><input type="radio" name="account" value="personal"> Personal</label>
                    <label><input type="radio" name="account" value="business"> Empresarial</label>
                </div>
            </div>

            <div class="form-group checkbox-group">
                <label><input type="checkbox" name="terms" required> Acepto los términos y condiciones de la plataforma</label>
            </div>

            <button type="submit" class="btn-submit">Enviar formulario</button>
        </form>
    </div>

</body>
</html>
